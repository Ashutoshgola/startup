version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: startup-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: startupdb
      MYSQL_USER: startup
      MYSQL_PASSWORD: startup123

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: startup-app:latest
    container_name: startup-app
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "10000:10000"

    environment:
      SPRING_PROFILES_ACTIVE: prod

      DB_URL: jdbc:mysql://mysql:3306/startupdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: startup
      DB_PASSWORD: startup123

      MAIL_USERNAME: YOUR_GMAIL
      MAIL_PASSWORD: YOUR_APP_PASSWORD

      NEWS_API_KEY: YOUR_NEWS_API_KEY

      PORT: 10000

volumes:
  mysql-data:
